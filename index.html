<title>NJ.D' RIDE — Custom Moto 3D Modelling Software</title>
<style>
html,body{margin:0;height:100%;background:#0c0d10;color:#e9e6df;font-family:"Segoe UI",system-ui,sans-serif}
.w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.b{width:100%;max-width:380px;background:#15171c;border:1px solid #2a2d35;border-radius:16px;padding:28px;text-align:center}
.b img{width:96px;height:96px;border-radius:20px}
h1{font-size:26px;margin:14px 0 4px;letter-spacing:.5px}h1 span{color:#e3a63b}

.e{color:#ff7a6e;font-size:13px;min-height:18px;margin-top:10px}.c{color:#666b75;font-size:11px;margin-top:18px}
</style></head><body>
<div class="w"><form class="b" id="f" autocomplete="off">
<img src="icon-192.png" alt="NJ.D' RIDE">
<h1>NJ.D' <span>RIDE</span></h1>
<p>Accesso riservato: inserisci la password</p>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
<button id="go" type="submit">Entra</button>
<div class="e" id="er"></div>
<div class="c">© 2026 dott. Jonathan D'Eugenio – Tutti i diritti riservati</div>
</form></div>
<script>
/* NJ.D' RIDE – accesso con password: l'app (index) è cifrata con AES-256-GCM, chiave derivata dalla password con PBKDF2-SHA256.
   Sul dispositivo resta solo la chiave derivata (mai la password), così dalla schermata Home si entra senza riscriverla.
   © 2026 dott. Jonathan D'Eugenio – Tutti i diritti riservati */
(function(){
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), K='njd-chiave';
let E=null; const pE=fetch('app.enc',{cache:'no-cache'}).then(r=>r.json()).then(j=>E=j).catch(()=>fetch('app.enc').then(r=>r.json()).then(j=>E=j));
async function apri(key){ await pE; const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.ct)); const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close(); }
async function daPassword(pw){ await pE; const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.salt),iterations:E.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']); }
(async()=>{ try{ const s=localStorage.getItem(K); if(s){ await pE; const key=await crypto.subtle.importKey('raw',b64(s),'AES-GCM',true,['decrypt']); await apri(key); return; } }catch(e){ try{localStorage.removeItem(K);}catch(_){} } })();
document.getElementById('f').addEventListener('submit',async ev=>{ ev.preventDefault(); const er=document.getElementById('er'), go=document.getElementById('go'); er.textContent=''; go.disabled=true; go.textContent='Verifica…';
  try{ const key=await daPassword(document.getElementById('pw').value); await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.ct));
    const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key)); try{localStorage.setItem(K,btoa(String.fromCharCode(...raw)));}catch(_){}
    await apri(key); }
  catch(e){ er.textContent=E?'Password errata':'Connessione assente: apri la prima volta con internet'; go.disabled=false; go.textContent='Entra'; } });
})();
</script></body></html>
